name: Dev release

on:
  push:
    branches: [develop]

jobs:
  preflight:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tidy
        run: go mod tidy

      - name: Verify working tree is clean
        run: git diff --exit-code -- go.mod go.sum

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run unit tests
        run: go test ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: make release-build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} VERSION=dev-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: sshcloak-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sshcloak-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7

  release:
    name: Publish dev pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create or update dev pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: Development snapshot
          prerelease: true
          body: |
            Automated snapshot from the `develop` branch.
            Commit: ${{ github.sha }}
          files: sshcloak-*
