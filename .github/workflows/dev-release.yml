name: Dev release

on:
  push:
    branches: [develop]

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-X github.com/sipuaz/sshcloak/cmd/internal/cli.Version=dev-$(git rev-parse --short HEAD)" \
            -o sshcloak-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd

      - uses: actions/upload-artifact@v4
        with:
          name: sshcloak-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sshcloak-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7

  release:
    name: Publish dev pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create or update dev pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development snapshot
          prerelease: true
          body: |
            Automated snapshot from the `develop` branch.
            Commit: ${{ github.sha }}
          files: sshcloak-*
