name: Release

on:
  push:
    tags: ['v*']

jobs:
  preflight:
    name: Validate tag and quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate semantic version tag
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Validate tag commit source branch
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/develop:refs/remotes/origin/develop

          if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main" || \
             git merge-base --is-ancestor "${GITHUB_SHA}" "origin/develop"; then
            echo "Tag commit is reachable from main or develop"
          else
            echo "Tag commit is not reachable from main or develop"
            exit 1
          fi

      - name: Run tidy
        run: go mod tidy

      - name: Verify working tree is clean
        run: git diff --exit-code -- go.mod go.sum

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run unit tests
        run: go test ./...

      - name: Run integration tests
        run: go test -tags integration ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: make release-build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} VERSION=${{ github.ref_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: sshcloak-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sshcloak-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1

  release:
    name: Publish release ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: sshcloak-*
